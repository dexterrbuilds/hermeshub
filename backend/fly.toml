# fly.toml app configuration file generated for hermes-hub-api on 2026-08-16T04:20:56-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hermes-hub-api'
primary_region = 'lhr'

[build]
[env]
  ENABLE_BETA_ADMIN_ENDPOINTS = 'true'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
